<style>

html,body{margin:0}

.hrow{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto}
.htitles{flex:1;min-width:0}

.c-blue{background:#DDF1F9;color:#0B6F95}.c-green{background:#DCF5E8;color:#167A4D}.c-pink{background:#FFE1EF;color:#C2185B}.c-amber{background:#FFF0D2;color:#A15C00}.c-purple{background:#EDE4FC;color:#6B3FB0}.c-red{background:#FDE2E3;color:#B42318}.c-teal{background:#D6F3EF;color:#0F766E}.c-slate{background:#E8EEF1;color:#41525B}.c-orange{background:#FFE7D6;color:#B4480A}

.row{display:flex;gap:10px;align-items:center}

.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ses::after{content:' min';font-weight:600;font-size:11px}.ses.used{background:#E5E7EB;color:#9CA3AF;text-decoration:line-through}.ses.gone{background:#FEE2E2;color:#DC2626;text-decoration:line-through}
.brush-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:52vh;overflow:auto;padding:2px}.brush-pick button{border:2px solid #E5E7EB;background:#fff;border-radius:16px;padding:8px 4px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}.brush-pick button.on{border-color:#FF2E93;background:#FFF0F7}.brush-pick b{font-size:13px}
.brush-card{background:linear-gradient(180deg,#FFF0F7,#FFFFFF)}.brush-name{font-weight:800;color:#BE185D;margin-bottom:6px}
.brush-stage{position:relative;width:250px;height:250px;margin:0 auto}.brush-ring svg{position:absolute;inset:0;width:100%;height:100%}.brush-bird{position:absolute;left:50%;top:50%;width:170px;margin:-85px 0 0 -85px;transform-origin:50% 85%}.brush-bird svg{width:170px;height:auto}
.brush-notes{position:absolute;inset:0;pointer-events:none}.brush-notes span{position:absolute;bottom:30%;font-size:26px;color:#FF2E93;animation:noteUp 2.2s ease-out forwards}

.bdance-bob{animation:bBob .5s ease-in-out infinite alternate}.bdance-sway{animation:bSway .7s ease-in-out infinite alternate}.bdance-hop{animation:bHop .6s cubic-bezier(.3,0,.5,1) infinite}.bdance-spin{animation:bSpin 2.4s ease-in-out infinite}
@keyframes bBob{from{transform:translateY(6px) scale(1,.96)}to{transform:translateY(-10px) scale(1,1.03)}}@keyframes bSway{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes bHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-30px) rotate(-6deg)}60%{transform:translateY(-30px) rotate(6deg)}}@keyframes bSpin{0%{transform:scaleX(1)}25%{transform:scaleX(-1) translateY(-8px)}50%{transform:scaleX(-1)}75%{transform:scaleX(1) translateY(-8px)}100%{transform:scaleX(1)}}
.brush-time{font-size:52px;font-weight:900;letter-spacing:1px;margin-top:6px}.brush-step{font-size:20px;font-weight:800;color:#0F172A}.brush-step.pop{animation:stepPop .5s ease}@keyframes stepPop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.wide main{max-width:1180px}

.dcol{background:#fff;border-radius:22px;padding:14px;box-shadow:0 1px 3px rgba(16,40,52,.06),0 6px 20px rgba(16,40,52,.05);margin-bottom:12px;display:flex;flex-direction:column;gap:8px}.week-grid .dcol{margin:0}
.dcol-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px}.dcol-dow{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}.dnum{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;font-size:18px}.is-today .dnum{background:#E8463C;color:#fff}

.evc-main{flex:1;min-width:0}.evc-t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis}.evc-e{font-size:19px}.evc-time{font-size:14px;color:#3D4D55;margin-top:3px;font-weight:600}.evc-wait{font-size:12px;font-weight:800;color:var(--ed);margin-top:3px}.evc-notes{font-size:13px;color:#4B5B63;margin-top:4px}

.faces{display:flex;flex:none}.face{display:inline-flex;border-radius:50%;border:2px solid #fff;background:var(--fc);margin-left:-8px}.face:first-child{margin-left:0}.face .char-av{display:block}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:700;color:#7A8A92;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.mc{border:0;background:#F6F8F9;border-radius:10px;min-height:64px;padding:4px 3px;font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer}.mc.empty{background:none}

.mc-ev{display:flex;flex-wrap:wrap;gap:0 2px;padding:0 2px}.mc-ev em{font-style:normal;font-size:0;line-height:1.2}.mc-ev em span{font-size:13px}.mc-ev b{display:none;font-size:10px;color:#3D4D55}.mc.has .mc-n{color:#1F2E35}

.year-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.ymonth{background:#fff;border-radius:18px;padding:10px;box-shadow:0 1px 3px rgba(16,40,52,.06)}.ym-h{border:0;background:none;font:inherit;font-weight:800;font-size:16px;margin-bottom:6px;padding:0;color:var(--ink)}

.linkbtn{border:0;background:none;color:#0E7490;font:inherit;font-weight:700;padding:0;text-decoration:underline;cursor:pointer}

.cd-t .ech{vertical-align:-6px;margin-right:2px}

.scards{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.row .scards{margin-top:0;gap:5px}
.scard{display:inline-block;width:26px;height:36px;border-radius:5px;border:2px dashed #CBD5E1;background:#fff;transform:rotate(-6deg)}.scard:nth-child(2){transform:rotate(2deg)}.scard:nth-child(3){transform:rotate(8deg)}
.scard.on{border:2px solid rgba(0,0,0,.15);background:var(--sc);box-shadow:0 2px 6px rgba(0,0,0,.18)}.scard.sm{width:14px;height:19px;border-radius:3px;border-width:1.5px}
.scard-msg{font-weight:700;font-size:14px;color:#334155;margin-left:4px}

class LocalStore {

    const mk = (name, role, design) => ({ id: uid(), family_id: 'demo', name, role, design: design || null });
    const members = [mk('Chris','parent'), mk('Kerry','parent'), mk('Ginnie','child','ginny'), mk('Fearne','child','fern')];

    return { members, items };
  }
  save() { lsSet(this.k, JSON.stringify(this.db)); }

  async add(kind, data, owner) { const it = { id: uid(), family_id: 'demo', kind, owner: owner || null, data, created_at: new Date().toISOString() }; this.db.items.push(JSON.parse(JSON.stringify(it))); this.save(); return it; }
  async update(id, data) { const it = this.db.items.find(i => i.id === id); if (it) { it.data = JSON.parse(JSON.stringify(data)); this.save(); } }
  async remove(id) { this.db.items = this.db.items.filter(i => i.id !== id); this.save(); }
  async updateMember(id, patch) { const m = this.db.members.find(x => x.id === id); if (m) { Object.assign(m, patch); this.save(); } }

}
class SupaStore {
  constructor(c) { this.c = c; }
  async load() {
    const [m, i] = await Promise.all([this.c.from('members').select('*'), this.c.from('items').select('*').order('created_at')]);
    if (m.error) throw m.error; if (i.error) throw i.error;
    return { members: m.data, items: i.data };
  }
  async add(kind, data, owner) {
    const { data: r, error } = await this.c.from('items').insert({ family_id: me.family_id, kind, owner: owner || null, data }).select().single();
    if (error) throw error; return r;
  }
  async update(id, data) { const { error } = await this.c.from('items').update({ data, updated_at: new Date().toISOString() }).eq('id', id); if (error) throw error; }
  async remove(id) { const { error } = await this.c.from('items').delete().eq('id', id); if (error) throw error; }
  async updateMember(id, patch) { const { error } = await this.c.from('members').update(patch).eq('id', id); if (error) throw error; }
  subscribe(cb) {
    this.c.channel('family').on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, cb)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, cb).subscribe();
    setInterval(cb, 30000);
  }
}

let msgMark = null;
function ping() { tone(1320, 0, .12, 'sine', .18); tone(1760, .12, .22, 'sine', .16); }
function updateChatBadge() {
  if (!me) return; const n = unreadChat(), d = $('#chatDot');
  if (d) { d.textContent = n > 9 ? '9+' : n; d.hidden = !n; }
  try { if ('setAppBadge' in navigator) { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) {}
  try { if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ badge: n }); } catch (e) {}
}
function checkNewMessages() {
  if (!me) return; const list = msgs(), latest = list.length ? (list[list.length - 1].data.at || list[list.length - 1].created_at) : '';
  if (msgMark === null) { msgMark = latest; updateChatBadge(); return; }
  const fresh = list.filter(m => (m.data.at || m.created_at) > msgMark && m.owner !== me.id);
  msgMark = latest || msgMark;
  if (fresh.length) {
    ping();
    const m = fresh[fresh.length - 1];
    if (view !== 'chat') toast(`💬 ${nameOf(m.owner)}: ${m.data.text.slice(0, 60)}`);

}

function render() {

function tickTimers() {
  const now = Date.now();
  document.querySelectorAll('[data-end]').forEach(e => { const left = Math.max(0, Number(e.dataset.end) - now); const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000); e.textContent = m + ':' + pad(s); });
  K('ipad').filter(s => s.data.status === 'running' && endOf(s) <= now).forEach(s => {
    const relevant = !isKid() || s.data.member === me.id;
    if (relevant && !alarmed.has(s.id)) {
      alarmed.add(s.id); lsSet('familyapp-alarmed', JSON.stringify([...alarmed].slice(-50)));
      if (now - endOf(s) < 10 * 60000) {
        alarmSound();
        if (!$('#modal').innerHTML) openModal(`<div class="center"><div style="font-size:60px">⏰</div><h3>${isKid() ? "Time's up!" : esc(nameOf(s.data.member)) + "'s iPad time is up"}</h3><p>${isKid() ? 'Time to come off the iPad. Well done for stopping!' : ''}</p><button class="btn big" data-act="close">OK</button></div>`);
        if ('Notification' in window && Notification.permission === 'granted') { try { new Notification("iPad time's up", { body: nameOf(s.data.member) + "'s time has finished." }); } catch (e) {} }
      }
    }
    if (s.data.status === 'running') upd(s.id, { status: 'done', usedMinutes: s.data.minutes }, { silent: true });
  });
}

/* ===== Countdowns and birthdays ===== */
function nextOccurrence(e) {
  const x = e.data, t = today();
  if (x.repeat === 'yearly') { const md = x.date.slice(5); let d = t.slice(0, 4) + '-' + md; if (d < t) d = (Number(t.slice(0, 4)) + 1) + '-' + md; return d; }
  if (x.repeat === 'weekly' || x.repeat === true) { if (x.date >= t) return x.date; const k = daysBetween(x.date, t) % 7; return addDays(t, k ? 7 - k : 0); }
  return x.date;
}
function countdownRow() {
  const mine = e => { const w = e.data.who; return w === me.id || (Array.isArray(w) && w.includes(me.id)); };
  const forAll = e => { const w = e.data.who; return !w || w === 'all'; };
  const show = e => {
    if (e.data.status === 'declined') return false;
    if (!isKid()) return e.data.countdown && e.data.status === 'approved';
    if (e.data.status === 'pending') return mine(e) && e.owner === me.id;
    if (mine(e)) return e.data.countdown || !e.data.repeat;
    return forAll(e) && e.data.countdown;
  };
  const cd = K('event').filter(show).map(e => ({ e, d: nextOccurrence(e) })).filter(o => o.d >= today() && (o.e.data.countdown ? cdLive(o.e, o.d) : daysBetween(today(), o.d) <= 30)).sort((a, b) => a.d.localeCompare(b.d)).slice(0, 6);
  if (!cd.length) return '';
  return `<div class="cd-row">${cd.map(({ e, d }) => { const n = daysBetween(today(), d); return `<button class="cd" data-act="eventDetail" data-id="${e.id}" data-x="${d}" style="background:${evBg(e.data.who)};--cc:${deepOf(whoIds(e.data.who)[0])}"><div class="cd-n">${n === 0 ? '🎉' : n}</div><div class="cd-l">${n === 0 ? 'Today!' : n === 1 ? 'day to go' : 'days to go'}</div><div class="cd-t">${emojiChip(e.data, 26)} ${esc(e.data.title)}${e.data.status === 'pending' ? '<div class="cd-w">Waiting for OK</div>' : ''}</div><div class="cd-faces">${facesOf(e.data.who, 22)}</div></button>`; }).join('')}</div>`;
}

let wxCache = null, wxBusy = false;
const WX = c => c === 0 ? ['clear_day', 'Sunny'] : c <= 2 ? ['partly_cloudy_day', 'Partly cloudy'] : c === 3 ? ['cloud', 'Cloudy'] : c <= 48 ? ['foggy', 'Foggy'] : c <= 57 ? ['rainy_light', 'Drizzle'] : c <= 67 ? ['rainy', 'Rain'] : c <= 77 ? ['weather_snowy', 'Snow'] : c <= 82 ? ['rainy_heavy', 'Showers'] : ['thunderstorm', 'Thunderstorms'];

  return `<div class="card wx" id="wx">${wxHtml()}</div>`;

function wxHtml() {
  const loc = settings().location, w = wxCache && wxCache.key === loc.lat + ',' + loc.lon ? wxCache : null;
  if (!w) return `<div class="row"><span class="chip c-blue">${ic('partly_cloudy_day', 'fill')}</span><div class="grow"><b>${esc(loc.name)}</b><div class="muted">Getting the forecast…</div></div></div>`;
  if (w.error) return `<div class="row"><span class="chip c-slate">${ic('cloud_off', 'fill')}</span><div class="grow"><b>${esc(loc.name)}</b><div class="muted">The forecast appears when the app is online.</div></div></div>`;

  return `<div class="wx-top"><div><div class="wx-place">${ic('location_on')} ${esc(loc.name)}</div><div class="wx-temp">${Math.round(w.temp)}°</div><div class="wx-word">${word} · H ${Math.round(w.max)}° L ${Math.round(w.min)}°</div></div>${ic(icon, 'fill wx-icon')}</div>

async function loadWeather() {
  const loc = settings().location; if (!loc || wxBusy) return;
  const key = loc.lat + ',' + loc.lon; if (wxCache && wxCache.key === key && Date.now() - wxCache.t < 30 * 60000) return;
  wxBusy = true;
  try {
    const f = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`).then(r => r.json());
    let m = null; try { m = await fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${loc.lat}&longitude=${loc.lon}&current=wave_height,wave_period,sea_surface_temperature&timezone=auto`).then(r => r.json()); } catch (e) {}
    wxCache = { key, t: Date.now(), temp: f.current.temperature_2m, code: f.current.weather_code, wind: f.current.wind_speed_10m, max: f.daily.temperature_2m_max[0], min: f.daily.temperature_2m_min[0],

/* ===== Strike cards: blue, yellow, red ===== */
const STRIKE_COLS = [['blue', '#2563EB', 'Blue card'], ['yellow', '#FACC15', 'Yellow card'], ['red', '#DC2626', 'Red card']];

    : st === 'denied' ? 'Pings are switched off for this app. On your iPhone go to Settings, then Notifications, then Family App, and turn on Allow Notifications.'
    : 'Get a ping and a red number on the app icon when someone sends a message, even when the app is closed.';
  return `<div class="card" style="border:2px solid #FCA5A5">${secH('notifications_active', 'red', 'Message pings are off')}<p class="muted" style="margin-top:0">${msg}</p>${st === 'default' ? '<button class="btn big" style="margin:0" data-act="notify">Turn on message pings</button>' : ''}</div>`;
}
A.testPing = async () => {
  try { const reg = await swRegister(); if (!reg) return toast('Pings need the app opened from the Home Screen'); await reg.showNotification('💬 Test ping', { body: 'Pings are working on this phone!', icon: 'icon.png', tag: 'test' }); try { navigator.setAppBadge && navigator.setAppBadge(1); } catch (e) {} toast('Sent! Check your notifications.'); } catch (e) { toast('Could not show a ping: ' + (e.message || e)); }
};
async function turnOnAlerts() {
  if (isIOS && !isStandalone()) { toast('First add the app to your Home Screen (Share, then Add to Home Screen), then open it from there.'); return; }
  try { await Notification.requestPermission(); } catch (e) {}
  if (Notification.permission === 'granted') { const ok = await pushSubscribe(); toast(ok ? "Message pings are on 🔔" : 'Pings allowed, but this phone could not sign up. Close the app and open it again.'); render(); updateChatBadge(); }
  else if (Notification.permission === 'denied') toast('Alerts are blocked. Turn them on in Settings, Notifications, Family App.');
}

/* ===== Start ===== */
async function reload() { try { const d = await store.load(); members = d.members; items = d.items; if (me) me = members.find(m => m.id === me.id) || me; } catch (e) { fail(e); } }
async function iconsReady() {
  const done = () => document.documentElement.classList.add('icons-ok');
  try { if (document.fonts && document.fonts.load) { document.fonts.load('24px "Material Symbols Rounded"', 'home').then(f => { if (f && f.length) done(); }).catch(() => {}); } } catch (e) {}
}
iconsReady();
async function boot() {
  try {
    if (CONFIG.SUPABASE_URL && window.supabase) {
      sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return showLogin();
      store = new SupaStore(sb); await reload();
      me = members.find(m => m.user_id === session.user.id);
      if (!me) { showLogin(); $('#loginMsg').textContent = "You're signed in but not in a family yet. Start a family below."; return; }
      store.subscribe(() => { clearTimeout(boot._t); boot._t = setTimeout(async () => { await reload(); softRender(); }, 400); });
    } else {
      store = new LocalStore(); await reload();
      store.subscribe(async () => { await reload(); softRender(); });
      me = members.find(m => m.id === lsGet('familyapp-me'));
      if (!me) return showPicker();
    }
    await ensureSeeds();
    if (new URLSearchParams(location.search).get('view') === 'chat') { view = 'chat'; history.replaceState(null, '', location.pathname); }
    render();
    swRegister(); if (sb) pushSubscribe();
  } catch (e) { fail(e); $('#app').innerHTML = `<div class="login"><div class="card"><h3>Couldn't start the app</h3><p>${esc(e.message || e)}</p></div></div>`; }
}
function regChatVotes() {
F.sendMsg = async f => { if (!f.text) return; await add('msg', { text: f.text, at: new Date().toISOString() }); setTimeout(() => { const i = $('#chatInput'); if (i) i.focus(); }, 50); };
A.msgMenu = el => { const m = items.find(i => i.id === el.dataset.id); if (!m) return; openModal(`<div class="center"><div class="muted">${esc(nameOf(m.owner))}</div><p style="font-size:18px">${esc(m.data.text)}</p><div class="row" style="justify-content:center;gap:8px;font-size:28px">${QUICK.map(e => `<button class="react-btn" data-act="react" data-id="${m.id}" data-x="${e}">${e}</button>`).join('')}</div>${m.owner === me.id || !isKid() ? `<button class="btn danger big mt" data-act="delMsg" data-id="${m.id}">${ic('delete')} Delete message</button>` : ''}<button class="btn sec big" data-act="close">Close</button></div>`); };
A.react = async el => { const m = items.find(i => i.id === el.dataset.id); const r = { ...(m.data.reacts || {}) }; if (r[me.id] === el.dataset.x) delete r[me.id]; else r[me.id] = el.dataset.x; closeModal(); await upd(m.id, { reacts: r }); };
A.delMsg = async el => { closeModal(); await del(el.dataset.id); };
A.pollModal = () => openModal(`<h3>Start a family vote</h3><form data-form="addPoll"><label>Question</label><input name="question" required value="What shall we do on Saturday?"><label>For which day? (optional)</label><input name="date" type="date" value="${(() => { const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7)); return ymd(d); })()}"><label>Ideas, one per line</label><textarea name="options" required placeholder="Beach and surfing&#10;Cinema&#10;Cricket in the park&#10;Bowling"></textarea><p class="muted">Everyone can add more ideas and change their vote until it's closed.</p><div class="row mt"><button class="btn grow">Start vote</button><button type="button" class="btn sec" data-act="close">Cancel</button></div></form>`);
F.addPoll = async f => {
  const opts = f.options.split('\n').map(t => t.trim()).filter(Boolean).slice(0, 12).map(t => ({ id: uid(), text: t }));
  if (opts.length < 2) return toast('Add at least two ideas');
  closeModal(); await add('poll', { question: f.question, date: f.date || '', options: opts, votes: {}, closed: false }, me.id, { silent: true });
  await add('msg', { text: f.question + (f.date ? ' (' + dayLabel(f.date) + ')' : '') + ' Go to Family votes to have your say!', at: new Date().toISOString(), poll: true }, me.id, { silent: true });
  render(); toast('Vote started!');
};
F.addOption = async (f, form) => { const p = items.find(i => i.id === form.dataset.id); if (!p || p.data.closed) return; await upd(p.id, { options: [...p.data.options, { id: uid(), text: f.text }] }); };
A.vote4 = el => { const p = items.find(i => i.id === el.dataset.id); if (!p || p.data.closed) return; const v = { ...(p.data.votes || {}) }; if (v[me.id] === el.dataset.x) delete v[me.id]; else v[me.id] = el.dataset.x; upd(p.id, { votes: v }); };
A.closePoll = async el => {
  const p = items.find(i => i.id === el.dataset.id), r = pollResults(p);
  await upd(p.id, { closed: true, closedBy: me.name }, { silent: true });
  const res = r.leaders.length === 1 ? `🏆 The family chose: ${r.leaders[0].text}!` : r.leaders.length > 1 ? `It's a tie between ${r.leaders.map(l => l.text).join(' and ')}!` : 'Nobody voted.';
  await add('msg', { text: `${p.data.question} ${res}`, at: new Date().toISOString(), poll: true }, me.id, { silent: true });
  render(); if (r.leaders.length) celebrate();
};
A.pollToCal = async el => { const p = items.find(i => i.id === el.dataset.id), r = pollResults(p); await add('event', { title: r.leaders.map(l => l.text).join(' or '), date: p.data.date, time: '', who: 'all', type: 'event', repeat: '', notes: 'Chosen in a family vote: ' + p.data.question, status: 'approved' }, me.id, { silent: true }); await upd(p.id, { addedToCal: true }); toast('Added to the calendar'); };
}
regChatVotes();
boot();
</script>
</body>
</html>
